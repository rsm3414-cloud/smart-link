<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スマートリンク</title>
<!-- Supabase JS クライアント（複数CDNフォールバック） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// CDN読み込み失敗時のフォールバック（file://プロトコル対策）
if (typeof window.supabase === 'undefined') {
  document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --primary: #f5a623;
  --primary-dark: #e09510;
  --blue: #2196F3;
  --blue-light: #e3f2fd;
  --red: #e53935;
  --red-light: #ffebee;
  --green: #43a047;
  --green-light: #e8f5e9;
  --orange: #fb8c00;
  --gray: #757575;
  --gray-light: #f5f5f5;
  --border: #e0e0e0;
  --text: #212121;
  --text2: #616161;
  --white: #fff;
  --header-h: 52px;
  --tab-h: 44px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; color: var(--text); font-size: 13px; }

/* ===== LOGIN ===== */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #fff8e1, #fff3e0, #fce4ec);
}
.loginBox {
  background: #fff; border-radius: 12px; padding: 40px 36px; width: 360px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}
.loginLogo { text-align: center; margin-bottom: 28px; }
.loginLogo .mark { font-size: 40px; margin-bottom: 4px; }
.loginLogo h1 { font-size: 26px; font-weight: 700; color: var(--primary); letter-spacing: 2px; }
.loginLogo p { font-size: 11px; color: var(--gray); margin-top: 2px; }
.roleTab { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.roleTabBtn { flex: 1; padding: 9px; border: none; background: #fff; color: var(--gray); cursor: pointer; font-size: 13px; font-family: inherit; transition: all .15s; }
.roleTabBtn.active { background: var(--primary); color: #fff; font-weight: 700; }
.fGroup { margin-bottom: 14px; }
.fGroup label { display: block; font-size: 11px; color: var(--gray); margin-bottom: 5px; font-weight: 500; }
.fGroup input, .fGroup select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-family: inherit; font-size: 13px; outline: none; color: var(--text);
  transition: border-color .15s;
}
.fGroup input:focus, .fGroup select:focus { border-color: var(--primary); }
.loginBtn {
  width: 100%; padding: 11px; border: none; border-radius: 8px;
  background: var(--primary); color: #fff; font-family: inherit; font-size: 14px;
  font-weight: 700; cursor: pointer; margin-top: 6px; transition: background .15s;
}
.loginBtn:hover { background: var(--primary-dark); }
.loginErr { color: var(--red); font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; }

/* ===== APP ===== */
#app { display: none; min-height: 100vh; flex-direction: column; }

/* HEADER */
.appHeader {
  height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.appHeaderLogo { font-size: 22px; color: var(--primary); margin-right: 4px; }
.appHeaderTitle { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
.appHeaderRight { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.headerUser { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.rolePill {
  padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 700;
  background: var(--primary); color: #fff;
}
.rolePill.store { background: var(--blue); }
.rolePill.manager { background: var(--green); }
.iconBtn {
  width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--gray); transition: background .15s;
}
.iconBtn:hover { background: var(--gray-light); }

/* TAB NAV */
.tabNav {
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; padding: 0 20px; gap: 0;
  position: sticky; top: var(--header-h); z-index: 190;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabNav::-webkit-scrollbar { display: none; }
.tabNavItem {
  padding: 12px 18px; border: none; background: transparent; font-family: inherit;
  font-size: 13px; color: var(--text2); cursor: pointer; position: relative;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  transition: color .15s;
}
.tabNavItem.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
.tabNavItem:hover:not(.active) { color: var(--text); }
.tabNavBadge {
  display: inline-block; background: var(--red); color: #fff; border-radius: 8px;
  padding: 0 5px; font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: middle;
}

/* TOOLBAR */
.toolbar {
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 8px 16px; gap: 8px; flex-wrap: wrap;
}
.btnPrimary {
  display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px;
  background: var(--blue); color: #fff; border: none; border-radius: 6px;
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.btnPrimary:hover { background: #1976d2; }
.btnOutline {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px;
  background: #fff; color: var(--text2); border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.btnOutline:hover { border-color: var(--blue); color: var(--blue); }
.filterSelect {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: #fff; border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
}
.filterSelect select {
  border: none; outline: none; font-family: inherit; font-size: 12px; color: var(--text); background: transparent; cursor: pointer;
}
.searchBox {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 6px; background: #fff;
  min-width: 180px; flex: 1; max-width: 280px;
}
.searchBox input { border: none; outline: none; font-family: inherit; font-size: 12px; color: var(--text); background: transparent; width: 100%; }
.toolbarRight { margin-left: auto; display: flex; gap: 6px; }

/* TABLE */
.tableWrap { overflow-x: auto; background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  background: #fafafa; border-bottom: 2px solid var(--border);
  padding: 9px 10px; text-align: left; font-size: 11px; font-weight: 700;
  color: var(--text2); white-space: nowrap; cursor: pointer; user-select: none;
  position: sticky; top: 0;
}
thead th:hover { background: #f0f0f0; }
thead th .sort { color: var(--border); margin-left: 2px; font-size: 10px; }
thead th.sorted .sort { color: var(--blue); }
tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .1s; }
tbody tr:hover { background: #f8f9ff; }
tbody tr.pinned { background: #fffde7; }
tbody tr.pinned:hover { background: #fff9c4; }
td { padding: 9px 10px; vertical-align: middle; }

/* PIN COL */
.pinBtn { background: none; border: none; cursor: pointer; font-size: 15px; color: #ccc; padding: 2px; transition: color .15s; }
.pinBtn.active { color: var(--primary); }

/* PRIORITY */
.priDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.priDot.urgent { background: var(--red); }
.priDot.high { background: var(--orange); }
.priDot.normal { background: var(--blue); }

/* TAG */
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
}
.tag-cat { background: #e8eaf6; color: #3949ab; }
.tag-urgent { background: var(--red-light); color: var(--red); }
.tag-high { background: #fff3e0; color: var(--orange); }
.tag-normal { background: var(--blue-light); color: var(--blue); }
.tag-done { background: var(--green-light); color: var(--green); }
.tag-na { background: #f5f5f5; color: var(--gray); }

/* PROGRESS */
.progressCell { min-width: 130px; }
.progressPct { font-weight: 700; font-size: 12px; color: var(--text); }
.progressSub { font-size: 10px; color: var(--text2); }
.progressBar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.progressFill { height: 100%; border-radius: 2px; background: var(--blue); transition: width .4s; }
.progressFill.done { background: var(--green); }
.progressFill.danger { background: var(--red); }

/* ACTION BTNS */
.actionBtns { display: flex; gap: 4px; white-space: nowrap; }
.btnAction {
  padding: 4px 10px; border-radius: 5px; border: 1px solid; font-family: inherit;
  font-size: 11px; cursor: pointer; font-weight: 500; transition: all .15s; white-space: nowrap;
}
.btnAction.detail { border-color: var(--border); color: var(--text2); background: #fff; }
.btnAction.detail:hover { border-color: var(--blue); color: var(--blue); }
.btnAction.progress { border-color: var(--red); color: var(--red); background: #fff; font-weight: 700; }
.btnAction.progress:hover { background: var(--red); color: #fff; }
.btnAction.report { border-color: var(--blue); color: var(--blue); background: #fff; }
.btnAction.report:hover { background: var(--blue); color: #fff; }
.btnAction.done-btn { border-color: var(--green); color: var(--green); background: #fff; }

/* DATE */
.dateCell { font-size: 11px; line-height: 1.5; }
.dateCell .overdue { color: var(--red); font-weight: 700; }
.dateCell .soon { color: var(--orange); }

/* EMPTY */
.emptyState { text-align: center; padding: 60px 20px; color: var(--gray); }
.emptyState .ei { font-size: 40px; margin-bottom: 10px; }

/* MODAL */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  background: #fff; border-radius: 12px; width: 100%; max-width: 600px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,.2); animation: mIn .18s ease;
}
.modal.wide { max-width: 800px; }
@keyframes mIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.modalHeader {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1;
}
.modalTitle { font-size: 15px; font-weight: 700; }
.closeBtn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: #fff; color: var(--gray); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.closeBtn:hover { background: var(--red-light); color: var(--red); border-color: var(--red); }
.modalBody { padding: 20px; }
.mRow { margin-bottom: 14px; }
.mRow label { display: block; font-size: 11px; color: var(--gray); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
.mRow input, .mRow textarea, .mRow select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-family: inherit; font-size: 13px; outline: none; color: var(--text); transition: border-color .15s;
}
.mRow input:focus, .mRow textarea:focus, .mRow select:focus { border-color: var(--blue); }
.mRow textarea { resize: vertical; min-height: 80px; }
.mGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mFooter { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.btnGray { padding: 8px 16px; border: 1px solid var(--border); border-radius: 7px; background: #fff; font-family: inherit; font-size: 13px; color: var(--text2); cursor: pointer; }
.btnBlue { padding: 8px 18px; border: none; border-radius: 7px; background: var(--blue); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.btnGreen { padding: 8px 18px; border: none; border-radius: 7px; background: var(--green); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.btnRed { padding: 8px 14px; border: none; border-radius: 7px; background: var(--red); color: #fff; font-family: inherit; font-size: 13px; cursor: pointer; }

/* STORE SELECTOR */
.storeSel { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.storeSelHead { background: #f5f5f5; padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--border); }
.storeSelList { max-height: 180px; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 2px; }
.storeChip { display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.storeChip:hover { background: #f5f5f5; }
.storeChip input { accent-color: var(--blue); cursor: pointer; }

/* ATTACH */
.attachList { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.attachItem {
  display: flex; align-items: center; gap: 5px; padding: 5px 10px;
  background: #f5f5f5; border: 1px solid var(--border); border-radius: 5px;
  font-size: 11px; cursor: pointer; transition: border-color .15s;
}
.attachItem:hover { border-color: var(--blue); color: var(--blue); }

/* PHOTO */
.photoWrap { position: relative; display: inline-block; }
.photoWrap img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
.photoRemove { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; cursor: pointer; }

/* REPORT DETAIL */
.storeRepCard { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.storeRepCard.done { border-color: #a5d6a7; background: #f1f8e9; }
.storeRepCard.pending { border-color: #ffcc80; background: #fff8e1; }
.storeRepCard .sName { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.storeRepCard .sMeta { font-size: 11px; color: var(--gray); }

/* SETTINGS */
.settTab { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.settTabBtn { padding: 9px 16px; border: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.settTabBtn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
.settCard { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
.settCardHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.settCardTitle { font-weight: 700; font-size: 13px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
  background: #323232; color: #fff; border-radius: 8px; font-size: 13px; z-index: 1000;
  box-shadow: 0 4px 16px rgba(0,0,0,.3); animation: toastIn .25s ease;
}
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }
@keyframes toastIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }

/* CHIPS */
.chip { display: flex; align-items: center; gap: 5px; padding: 5px 12px; background: #f5f5f5; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; }
.chip span { cursor: pointer; color: var(--gray); }
.chip span:hover { color: var(--red); }
.chipGroup { display: flex; gap: 6px; flex-wrap: wrap; }

/* UTIL */
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.tRight { text-align: right; }
.flex { display: flex; align-items: center; gap: 8px; }
input[type=checkbox] { accent-color: var(--blue); }

/* REPORT GRID */
.repGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .repGrid { grid-template-columns: 1fr; } }

/* PAGE CONTENT */
.pageContent { padding: 0; }

/* SETTINGS PAGE */
.settPage { padding: 16px; max-width: 900px; }

table.mini td, table.mini th { padding: 7px 10px; }

/* ===== MOBILE RESPONSIVE ===== */
:root {
  --bottom-nav-h: 60px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---- LOGIN mobile ---- */
@media (max-width: 480px) {
  .loginBox {
    width: 100%; border-radius: 0;
    padding: 32px 20px;
    min-height: 100vh;
    box-shadow: none;
  }
  #loginScreen { align-items: flex-start; }
}

/* ---- HEADER mobile ---- */
@media (max-width: 640px) {
  .appHeader { padding: 0 12px; height: 48px; }
  .appHeaderTitle { font-size: 14px; letter-spacing: 0; }
  #hUser { display: none; }
  .headerUser { gap: 4px; }
}

/* ---- TAB NAV: hide on mobile → use bottom nav ---- */
@media (max-width: 640px) {
  .tabNav { display: none !important; }
  #pageArea { padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom)); }
}

/* ---- BOTTOM NAV ---- */
#bottomNav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--bottom-nav-h) + var(--safe-bottom));
  background: #fff;
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  z-index: 190;
  align-items: stretch;
  padding-bottom: var(--safe-bottom);
}
@media (max-width: 640px) {
  #bottomNav { display: flex; }
}
.bnItem {
  flex: 1; border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 6px 2px; color: var(--gray); font-family: inherit;
  position: relative; transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.bnItem.active { color: var(--blue); }
.bnItem .bnIcon { font-size: 20px; line-height: 1; }
.bnItem .bnLabel { font-size: 9px; font-weight: 500; white-space: nowrap; }
.bnBadge {
  position: absolute; top: 4px; right: calc(50% - 16px);
  background: var(--red); color: #fff; border-radius: 8px;
  padding: 0 4px; font-size: 9px; font-weight: 700; min-width: 14px; text-align: center;
}

/* ---- TOOLBAR mobile ---- */
@media (max-width: 640px) {
  .toolbar {
    padding: 8px 10px; gap: 6px;
  }
  .toolbar .filterSelect,
  .toolbar .searchBox,
  .toolbar .btnOutline:not(.mobileShow) {
    display: none;
  }
  .toolbar.expanded .filterSelect,
  .toolbar.expanded .searchBox,
  .toolbar.expanded .btnOutline { display: flex; }
  .mobileFilterToggle {
    display: flex !important;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; font-family: inherit; font-size: 12px; color: var(--text2);
    cursor: pointer; gap: 4px; align-items: center;
  }
}
@media (min-width: 641px) {
  .mobileFilterToggle { display: none; }
}

/* ---- TABLE → CARDS on mobile ---- */
@media (max-width: 640px) {
  .tableWrap table,
  .tableWrap thead,
  .tableWrap tbody,
  .tableWrap th,
  .tableWrap td,
  .tableWrap tr { display: block; }

  .tableWrap thead { display: none; }

  .tableWrap tbody tr {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 10px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .tableWrap tbody tr td {
    padding: 3px 0;
    border: none;
  }
  /* pin列・重要度列を非表示 */
  .tableWrap tbody tr td:nth-child(1),
  .tableWrap tbody tr td:nth-child(2) { display: none; }
  /* カテゴリ・タイトルは縦積み */
  .tableWrap tbody tr td:nth-child(3) { margin-bottom: 4px; }
  .tableWrap tbody tr td:nth-child(4) { font-size: 14px; margin-bottom: 8px; }
  /* 日時列は小さく横並び */
  .tableWrap tbody tr td.dateCell {
    display: inline-block;
    font-size: 10px;
    margin-right: 10px;
    color: var(--text2);
  }
  /* 進捗セルはフル幅 */
  .tableWrap .progressCell { margin: 6px 0; }
  /* アクションボタンはフル幅 */
  .tableWrap .actionBtns {
    display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
  }
  .tableWrap .btnAction {
    flex: 1; text-align: center; padding: 8px 4px; font-size: 12px;
  }
}

/* ---- MODAL → BOTTOM SHEET on mobile ---- */
@media (max-width: 640px) {
  .overlay {
    align-items: flex-end;
    padding: 0;
  }
  .modal {
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    max-width: 100%;
    width: 100%;
    animation: sheetIn .25s ease;
    padding-bottom: var(--safe-bottom);
  }
  .modal.wide { max-width: 100%; }
  @keyframes sheetIn {
    from { transform: translateY(100%); opacity: 1; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .mGrid { grid-template-columns: 1fr; }
}

/* ---- DASHBOARD cards mobile ---- */
@media (max-width: 640px) {
  .dashKpiGrid { grid-template-columns: repeat(2,1fr) !important; }
  .dashTwoCol  { grid-template-columns: 1fr !important; }
}

// Supabase操作ヘルパー
const SB = {
  async get(table) {
    if (!_sb) return [];
    const { data, error } = await _sb.from(table).select('*');
    if (error) { console.error('[SB.get]', table, error); return []; }
    return data ?? [];
  },
  async upsert(table, rows) {
    if (!_sb || !rows || rows.length === 0) return;
    const { error } = await _sb.from(table).upsert(rows, { onConflict: 'id' });
    if (error) console.error('[SB.upsert]', table, error);
  },
  async upsertOne(table, row, conflictCol = 'id') {
    if (!_sb) return;
    const { error } = await _sb.from(table).upsert(row, { onConflict: conflictCol });
    if (error) console.error('[SB.upsertOne]', table, error);
  },
  async delete(table, col, val) {
    if (!_sb) return;
    const { error } = await _sb.from(table).delete().eq(col, val);
    if (error) console.error('[SB.delete]', table, error);
  },
  async getSetting(key) {
    if (!_sb) return null;
    const { data } = await _sb.from('settings').select('value').eq('key', key).single();
    return data?.value ?? null;
  },
  async setSetting(key, value) {
    if (!_sb) return;
    await _sb.from('settings').upsert({ key, value }, { onConflict: 'key' });
  },
  async isEmpty(table) {
    if (!_sb) return true;
    const { count } = await _sb.from(table).select('*', { count: 'exact', head: true });
    return (count ?? 0) === 0;
  }
};

// ========== loadDB（非同期・Supabase優先 → localStorageフォールバック）==========
async function loadDB() {
  try {
    // Supabaseに店舗データがあるか確認
    const storesData = await SB.get('stores');

    if (storesData.length > 0) {
      // ── Supabaseからロード ──
      const [
        usersData, staffData, deptsData, docsData, reportsData,
        messagesData, draftsData, templatesData, remindersData
      ] = await Promise.all([
        SB.get('hq_users'), SB.get('hq_staff'), SB.get('departments'),
        SB.get('docs'), SB.get('reports'), SB.get('messages'),
        SB.get('doc_drafts'), SB.get('templates'), SB.get('reminders'),
      ]);

      DB.stores      = storesData.map(s => ({ code: s.code, name: s.name, area: s.area || '', pass: s.pass || '1234' }));
      DB.users       = usersData.map(u => ({ id: u.id, name: u.name, pass: u.pass, role: u.role || 'hq' }));
      DB.hqStaff     = staffData.map(s => ({
        id: s.id, name: s.name, pass: s.pass || '',
        staffRole: s.staff_role || '', department: s.department || '',
        managerId: s.manager_id || '', managerName: s.manager_name || '',
        role: s.role || 'hq'
      }));
      DB.departments = deptsData.map(d => ({ name: d.name }));
      DB.docs        = docsData.map(d => ({
        id: d.id, title: d.title, body: d.body, category: d.category,
        priority: d.priority, deadline: d.deadline,
        sentBy: d.sent_by, sentAt: d.sent_at,
        targets: d.targets || [], attachments: d.attachments || [],
        readBy: d.read_by || [], pinned: d.pinned || false
      }));
      DB.reports     = reportsData.map(r => ({
        id: r.id, docId: r.doc_id, storeCode: r.store_code,
        status: r.status, comment: r.comment || '',
        photos: r.photos || [], reportedAt: r.reported_at
      }));
      DB.messages    = messagesData.map(m => ({
        id: m.id, storeCode: m.store_code, storeName: m.store_name || '',
        body: m.body, readByHQ: m.read_by_hq || false, createdAt: m.created_at
      }));
      DB.docDrafts   = draftsData.map(d => ({
        id: d.id, title: d.title, body: d.body, category: d.category,
        priority: d.priority, deadline: d.deadline,
        targets: d.targets || [], attachments: d.attachments || [],
        status: d.status, authorId: d.author_id, authorName: d.author_name || '',
        approverId: d.approver_id || null, approverName: d.approver_name || '',
        rejectComment: d.reject_comment || null, createdAt: d.created_at
      }));
      DB.templates   = templatesData.map(t => ({
        id: t.id, title: t.title, category: t.category, priority: t.priority,
        body: t.body, createdBy: t.created_by || '', createdAt: t.created_at
      }));
      DB.reminders   = remindersData.map(r => ({
        id: r.id, docId: r.doc_id, sentBy: r.sent_by, sentAt: r.sent_at
      }));

      // カウンター・設定
      const [nid, nmid, ndid, ntid, wf, areas, cats] = await Promise.all([
        SB.getSetting('next_id'), SB.getSetting('next_msg_id'),
        SB.getSetting('next_draft_id'), SB.getSetting('next_tpl_id'),
        SB.getSetting('workflow_enabled'), SB.getSetting('areas'),
        SB.getSetting('categories'),
      ]);
      if (nid  !== null) DB.nextId       = parseInt(nid)  || 1;
      if (nmid !== null) DB.nextMsgId    = parseInt(nmid) || 1;
      if (ndid !== null) DB.nextDraftId  = parseInt(ndid) || 1;
      if (ntid !== null) DB.nextTplId    = parseInt(ntid) || 1;
      if (wf   !== null) DB.workflowEnabled = wf !== false && wf !== 'false';
      if (Array.isArray(areas)) DB.areas = areas;
      if (Array.isArray(cats))  DB.categories = cats;

      console.log('[loadDB] Supabaseからロード完了');

    } else {
      // ── localStorageフォールバック ──
      _loadFromLocalStorage();
      console.log('[loadDB] Supabaseにデータなし → localStorageからロード');
    }
  } catch(e) {
    console.error('[loadDB] Supabaseエラー → localStorageフォールバック:', e);
    _loadFromLocalStorage();
  }
}

function _loadFromLocalStorage() {
  const r = localStorage.getItem(LS_KEY);
  if (!r) return;
  try {
    const d = JSON.parse(r);
    ['docs','reports','messages','departments','hqStaff','docDrafts','templates',
     'reminders','stores','areas','categories','users',
     'nextId','nextMsgId','nextDraftId','nextTplId','workflowEnabled'
    ].forEach(k => { if (d[k] !== undefined) DB[k] = d[k]; });
  } catch(e) { console.error('[_loadFromLocalStorage]', e); }
}

function renderDashboard(el) {
  const total = DB.docs.length;
  const now = new Date();

  // 全体集計
  const doneCount  = DB.docs.filter(d => complRate(d) === 100).length;
  const overdueCount = DB.docs.filter(d => d.deadline && new Date(d.deadline) < now && complRate(d) < 100).length;
  const pendingCount = total - doneCount - overdueCount;

  // 期限超過文書一覧（最新5件）
  const overdueDocs = DB.docs
    .filter(d => d.deadline && new Date(d.deadline) < now && complRate(d) < 100)
    .sort((a,b) => a.deadline.localeCompare(b.deadline))
    .slice(0, 5);

  // 未対応店舗が多い文書トップ5
  const worstDocs = DB.docs
    .filter(d => complRate(d) < 100)
    .map(d => ({
      ...d,
      pendN: d.targets.filter(s => !DB.reports.some(r=>r.docId===d.id&&r.storeCode===s)).length
    }))
    .sort((a,b) => b.pendN - a.pendN)
    .slice(0, 5);

  // エリア別完了率

    return { area, rate: total2>0 ? Math.round(doneTotal/total2*100) : 0, total:total2 };

          <button class="btnOutline" style="font-size:11px;padding:3px 10px" onclick="listFilter.status='overdue';goTab('list')">一覧へ</button>
        </div>
        ${!overdueDocs.length
          ? `<div style="text-align:center;padding:20px;color:var(--gray);font-size:13px">✅ 期限超過なし</div>`
          : overdueDocs.map(d=>{
              const pendN = d.targets.filter(s=>!DB.reports.some(r=>r.docId===d.id&&r.storeCode===s)).length;

// ========== ② REMINDER MODAL (期限超過催促) ==========
function openReminderModal(docId) {
  const doc = DB.docs.find(d=>d.id===docId);
  if (!doc) return;
  const pendStores = doc.targets.filter(s => !DB.reports.some(r=>r.docId===doc.id&&r.storeCode===s));
  const overdueStores = doc.targets.filter(s => {
    const isOD = doc.deadline && new Date(doc.deadline) < new Date();
    return isOD && !DB.reports.some(r=>r.docId===doc.id&&r.storeCode===s);
  });
  const targets = overdueStores.length ? overdueStores : pendStores;

  showModal(`<div class="modal wide">
    <div class="modalHeader">
      <span class="modalTitle">📢 催促送信 — ${doc.title}</span>
      <button class="closeBtn" onclick="closeModal()">✕</button>
    </div>
    <div class="modalBody">
      <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#795548">
        <b>対象店舗 ${targets.length}店舗</b>に催促メッセージを送信します。
        店舗側の「受信文書」に催促フラグ付きで通知されます。
      </div>
      <div class="mRow">
        <label>催促メッセージ *</label>
        <textarea id="reminderMsg" rows="4" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;resize:vertical"
          placeholder="例：期限が過ぎています。至急ご対応・完了報告をお願いします。"
>期限が超過しています。至急ご対応いただき、完了報告を送信してください。</textarea>
      </div>
      <div style="background:#f9f9f9;border-radius:8px;padding:10px 12px;max-height:160px;overflow-y:auto">
        <p style="font-size:11px;color:var(--gray);font-weight:600;margin-bottom:6px">催促対象店舗</p>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${targets.map(s=>`<span style="font-size:11px;padding:2px 8px;background:#fff;border:1px solid var(--border);border-radius:4px">${storeName(s)}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="mFooter">
      <button class="btnGray" onclick="closeModal()">キャンセル</button>
      <button class="btnPrimary" style="background:var(--orange);border:none" onclick="sendReminder('${docId}')">📢 催促を送信する</button>
    </div>
  </div>`);
}
async function sendReminder(docId) {
  const msg = document.getElementById('reminderMsg').value.trim();
  if (!msg) { toast('メッセージを入力してください','error'); return; }
  const doc = DB.docs.find(d=>d.id===docId);
  const targets = doc.targets.filter(s => !DB.reports.some(r=>r.docId===doc.id&&r.storeCode===s));
  // 催促フラグをdocに付与（店舗側で表示）
  if (!doc.reminders) doc.reminders = [];
  doc.reminders.push({ msg, targets:[...targets], sentAt: new Date().toISOString(), sentBy: CU.name });
  // 催促ログ
  DB.reminders.push({ docId, docTitle: doc.title, msg, targetCount: targets.length, sentAt: new Date().toISOString(), sentBy: CU.name });
  await saveDB(); closeModal();
  toast(`${targets.length}店舗に催促を送信しました`,'success');
  renderDashboard(document.getElementById('pageArea'));
}

async function saveTemplate(id) {
  const title = document.getElementById('tplTitle').value.trim();
  const body = document.getElementById('tplBody').value.trim();
  if (!title) { toast('テンプレート名を入力してください','error'); return; }
  if (!body) { toast('連絡文を入力してください','error'); return; }
  const data = {
    title, body,
    category: document.getElementById('tplCat').value,
    priority: document.getElementById('tplPri').value,
    defaultDays: parseInt(document.getElementById('tplDays').value)||null,
  };
  if (id) {
    const t = DB.templates.find(x=>x.id===id);
    Object.assign(t, data);
    toast('テンプレートを更新しました','success');
  } else {
    DB.templates.push({ id:'T'+String(DB.nextTplId++).padStart(4,'0'), ...data, createdAt: new Date().toISOString() });
    toast('テンプレートを登録しました','success');
  }
  await saveDB(); closeModal(); renderTplList();
}
function editTemplate(id) {
  const t = DB.templates.find(x=>x.id===id);

}
async function deleteTemplate(id) {
  if (!confirm('このテンプレートを削除しますか？')) return;
  DB.templates = DB.templates.filter(t=>t.id!==id);
  await saveDB(); renderTplList(); toast('削除しました');
}

// ========== HELPERS ==========
function myDocs() { return DB.docs.filter(d => d.targets.includes(CU.storeCode)); }
function isReported(docId) { return DB.reports.some(r => r.docId===docId && r.storeCode===CU.storeCode); }
function getReport(docId, code) { return DB.reports.find(r => r.docId===docId && r.storeCode===code); }
function unreadCount() { return myDocs().filter(d => !d.readBy?.includes(CU.storeCode)).length; }
function pendingDocCount() { return DB.docs.filter(d => complRate(d) < 100).length; }
function complRate(doc) {
  if (!doc.targets?.length) return 0;
  const done = doc.targets.filter(s => DB.reports.some(r => r.docId===doc.id && r.storeCode===s && r.status==='done')).length;
  return Math.round(done/doc.targets.length*100);
}
function storeName(code) { return DB.stores.find(s=>s.code===code)?.name || code; }
function fmt(iso) { if(!iso) return ''; return iso.replace('T',' ').slice(0,16); }
function fmtDate(iso) {
  if(!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}<br>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function deadlineClass(dl, done) {
  if (!dl || done) return '';
  const diff = Math.ceil((new Date(dl) - new Date()) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return '';
}
function priTag(p) {
  if (p==='urgent') return '<span class="tag tag-urgent">緊急</span>';
  if (p==='high') return '<span class="tag tag-high">重要</span>';
  return '<span class="tag tag-normal">通常</span>';
}
function priDot(p) {
  const cls = p==='urgent'?'urgent':p==='high'?'high':'normal';
  return `<span class="priDot ${cls}"></span>`;
}

function sortBy(col) {
  if (listFilter.sort === col) listFilter.asc = !listFilter.asc;
  else { listFilter.sort = col; listFilter.asc = true; }
  renderTable();
}

function renderTable() {
  const isHQ = CU.role === 'hq';
  let docs = isHQ ? [...DB.docs] : myDocs();
  const f = listFilter;

  // Filter
  if (f.q) docs = docs.filter(d => d.title.includes(f.q) || d.body?.includes(f.q));
  if (f.cat) docs = docs.filter(d => d.category === f.cat);
  if (f.priority) docs = docs.filter(d => d.priority === f.priority);
  if (f.status) {
    docs = docs.filter(d => {
      const rate = isHQ ? complRate(d) : (isReported(d.id) ? 100 : 0);
      const od = d.deadline && new Date(d.deadline) < new Date() && rate < 100;
      if (f.status === 'done') return rate === 100;
      if (f.status === 'pending') return rate < 100 && !od;
      if (f.status === 'overdue') return od;
      return true;
    });
  }

  // Sort
  docs.sort((a,b) => {
    let va = a[f.sort] || '', vb = b[f.sort] || '';
    // pinned first
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (va < vb) return f.asc ? -1 : 1;
    if (va > vb) return f.asc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('mainTbody');
  if (!tbody) return;

  if (docs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="emptyState"><div class="ei">📭</div><p>該当する文書がありません</p></td></tr>`;
    return;
  }

  tbody.innerHTML = docs.map(d => {
    const rate = isHQ ? complRate(d) : (isReported(d.id) ? 100 : 0);
    const done = rate === 100;
    const dlCls = deadlineClass(d.deadline, done);
    const totalN = d.targets?.length || 0;
    const doneN = isHQ ? d.targets?.filter(s => DB.reports.some(r=>r.docId===d.id&&r.storeCode===s&&r.status==='done')).length : (done?1:0);
    const fillCls = done ? 'done' : (dlCls === 'overdue' ? 'danger' : '');
    const isUnread = !isHQ && !d.readBy?.includes(CU.storeCode);

    const actionBtns = isHQ
      ? `<div class="actionBtns">
          <button class="btnAction detail" onclick="openDocDetail('${d.id}')">指示詳細</button>
          <button class="btnAction progress" onclick="openDocDetail('${d.id}')">進捗状況</button>
        </div>`
      : done
        ? `<button class="btnAction done-btn" onclick="openStoreDoc('${d.id}')">✅ 報告済</button>`
        : `<div class="actionBtns">
            <button class="btnAction detail" onclick="openStoreDoc('${d.id}')">詳細</button>
            <button class="btnAction report" onclick="openStoreDoc('${d.id}')">完了報告</button>
          </div>`;

    return `<tr class="${d.pinned?'pinned':''}">
      <td><button class="pinBtn ${d.pinned?'active':''}" onclick="togglePin('${d.id}',event)" title="ピン留め">📌</button></td>
      <td>${priDot(d.priority)}</td>
      <td><span class="tag tag-cat">${d.category}</span></td>
      <td style="font-weight:${isUnread?'700':'400'};cursor:pointer" onclick="${isHQ?`openDocDetail('${d.id}')`:`openStoreDoc('${d.id}')`}">
        ${isUnread?'<span style="color:var(--red);font-size:10px;margin-right:4px">●</span>':''}
        ${!isHQ && d.reminders?.length ? '<span style="font-size:10px;background:var(--orange);color:#fff;padding:1px 5px;border-radius:3px;margin-right:4px">📢催促</span>' : ''}
        ${d.title}
        ${d.attachments?.length ? `<span style="font-size:10px;color:var(--gray);margin-left:4px">📎${d.attachments.length}</span>` : ''}
      </td>
      ${isHQ ? `<td class="dateCell">${fmtDate(d.sentAt)}</td>` : ''}
      <td class="dateCell">${fmtDate(d.sentAt)}</td>
      <td class="dateCell"><span class="${dlCls}">${d.deadline ? fmtDate(d.deadline+'T18:00') : '—'}</span></td>
      <td class="progressCell">
        <div class="progressPct">${rate}%</div>
        <div class="progressSub">(${doneN}/${totalN})</div>
        <div class="progressBar"><div class="progressFill ${fillCls}" style="width:${rate}%"></div></div>
      </td>
      <td>${actionBtns}</td>
    </tr>`;
  }).join('');
}

  } else {
    targetBuf = [];
    panel.innerHTML = `<div class="storeSel">
      <div class="storeSelHead">
        <button class="btnGray" style="font-size:11px;padding:3px 8px" onclick="selAllStores(true)">全選択</button>
        <button class="btnGray" style="font-size:11px;padding:3px 8px" onclick="selAllStores(false)">全解除</button>

function updAreaT() {
  targetBuf = [];
  document.querySelectorAll('#tmPanel input:checked').forEach(cb => {
    DB.stores.filter(s=>s.area===cb.value).forEach(s=>targetBuf.push(s.code));
  });
  updTSummary();
}
function updStoreT() {
  targetBuf = Array.from(document.querySelectorAll('#tmPanel input:checked')).map(cb=>cb.value);
  updTSummary();
}
function selAllStores(v) { document.querySelectorAll('#tmPanel input').forEach(cb=>cb.checked=v); updStoreT(); }
function updTSummary() {
  const el = document.getElementById('tmSummary');
  if (el) el.textContent = `選択中: ${targetBuf.length}店舗`;
}
function addAttach(inp) {
  Array.from(inp.files).forEach(f => {
    const r = new FileReader();
    r.onload = e => { attachBuf.push({name:f.name,size:f.size,data:e.target.result,type:f.type}); renderAttachPv(); };
    r.readAsDataURL(f);
  });
}
function renderAttachPv() {
  const el = document.getElementById('attachPv');
  if (!el) return;
  el.innerHTML = attachBuf.map((a,i)=>`<div class="attachItem">📎 ${a.name} <span style="color:var(--gray);font-size:10px">${Math.round(a.size/1024)}KB</span> <span onclick="attachBuf.splice(${i},1);renderAttachPv()" style="cursor:pointer;color:var(--red)">✕</span></div>`).join('');
}
function buildDocPayload() {
  const title = document.getElementById('nTitle').value.trim();
  const body = document.getElementById('nBody').value.trim();
  if (!title) { toast('タイトルを入力してください','error'); return null; }
  if (!body) { toast('連絡文を入力してください','error'); return null; }
  if (!targetBuf.length) { toast('送信先を選択してください','error'); return null; }
  const noDl = document.getElementById('nNoDl').checked;
  const dlVal = document.getElementById('nDl').value;
  return {
    title, body,
    category: document.getElementById('nCat').value,
    priority: document.getElementById('nPri').value,
    deadline: noDl ? null : (dlVal || null),
    targets: [...targetBuf],
    attachments: attachBuf.map(a=>({...a})),
    authorId: CU.id,
    authorName: CU.name,
  };
}
async function saveDraft(status='draft') {
  const payload = buildDocPayload();
  if (!payload) return;
  const draft = {
    id: 'DR'+String(DB.nextDraftId++).padStart(4,'0'),
    ...payload,
    status, // draft | pending | approved | rejected
    createdAt: new Date().toISOString(),
    approverId: null,
    approverName: null,
    approvedAt: null,
    rejectComment: null,
  };
  DB.docDrafts.push(draft);
  await saveDB(); closeModal();
  toast('下書きを保存しました','success');
  goTab('drafts');
}
async function sendDoc() {
  const payload = buildDocPayload();
  if (!payload) return;
  const managers = DB.hqStaff.filter(s=>s.staffRole==='manager');
  const wfEnabled = DB.workflowEnabled && managers.length > 0 && !(!CU.staffRole);
  const wfCb = document.getElementById('wfUse');
  const useWF = wfCb && wfCb.checked && wfEnabled;

  if (useWF) {
    // 承認ワークフロー申請
    const approverId = document.getElementById('wfApproverId')?.value;
    if (!approverId) { toast('承認者（所属長）を選択してください','error'); return; }
    const approver = DB.hqStaff.find(s=>s.id===approverId);
    const draft = {
      id: 'DR'+String(DB.nextDraftId++).padStart(4,'0'),
      ...payload,
      status: 'pending',
      approverId,
      approverName: approver?.name || '',
      createdAt: new Date().toISOString(),
      approvedAt: null,
      rejectComment: null,
    };
    DB.docDrafts.push(draft);
    await saveDB(); closeModal();
    toast(`「${payload.title}」を${approver?.name}に承認申請しました`,'success');
    renderTabs(); goTab('list');
  } else {
    // 直接送信
    const doc = {
      id: 'D'+String(DB.nextId++).padStart(4,'0'),
      ...payload,
      sentAt: new Date().toISOString(),
      sentBy: CU.name,
      readBy: [],
      pinned: false,
    };
    DB.docs.unshift(doc);
    await saveDB(); closeModal();
    toast(`「${payload.title}」を${targetBuf.length}店舗に送信しました`,'success');
    renderTable();
  }
}

function addPhoto(inp) {
  Array.from(inp.files).forEach(f => {
    const r = new FileReader();
    r.onload = async e=>{
      resizeImg(e.target.result, 400, data => { photoBuf.push(data); renderPhotoPv(); });
    };
    r.readAsDataURL(f);
  });
}
function resizeImg(src, max, cb) {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, max/img.width, max/img.height);
    const cv = document.createElement('canvas');
    cv.width = img.width*sc; cv.height = img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',.7));
  };
  img.src = src;
}
function renderPhotoPv() {
  const el = document.getElementById('photoPv');
  if (!el) return;
  el.innerHTML = photoBuf.map((p,i)=>`<div class="photoWrap"><img src="${p}" onclick="showPhoto('${p}')"><span class="photoRemove" onclick="photoBuf.splice(${i},1);renderPhotoPv()">✕</span></div>`).join('');
}
async function submitReport(docId) {
  const stat = document.getElementById('rStat').value;
  const com = document.getElementById('rCom').value.trim();
  DB.reports.push({docId, storeCode:CU.storeCode, status:stat, comment:com, photos:[...photoBuf], reportedAt:new Date().toISOString()});
  await saveDB(); closeModal(); toast('報告を送信しました','success');
  renderTabs(); renderTable();
}

function dlStoreTemplate() {
  const csv='\uFEFF'+'コード,店舗名,エリア,PIN\nS013,新店舗名,関東,1234\n';

async function importStoreCSV(inp) {
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async e=>{
    const lines=e.target.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    let added=0,skipped=0;
    lines.forEach((line,i)=>{
      if(i===0&&line.includes('コード'))return;
      const [code,name,area,pass]=line.split(',').map(v=>v.trim());
      if(!code||!name){skipped++;return;}
      if(DB.stores.find(s=>s.code===code.toUpperCase())){skipped++;return;}
      DB.stores.push({code:code.toUpperCase(),name,area:area||'',pass:pass||'1234'});
      added++;
    });
    await saveDB();inp.value='';renderSettPanel();initLoginStores();
    toast(`${added}件追加、${skipped}件スキップ`,'success');
  };
  r.readAsText(f,'UTF-8');
}

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='スタッフ登録テンプレート.csv';a.click();

async function importStaffCSV(inp) {
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async e=>{
    const lines=e.target.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    let added=0,skipped=0;
    lines.forEach((line,i)=>{
      if(i===0&&(line.includes('ID')||line.includes('氏名')))return;
      const [id,name,pass,role,dept,managerId]=line.split(',').map(v=>v.trim());
      if(!id||!name){skipped++;return;}
      if(DB.hqStaff.find(s=>s.id===id)||DB.users.find(u=>u.id===id)){skipped++;return;}
      const staffRole=(role==='manager')?'manager':'staff';
      const mgr = managerId ? DB.hqStaff.find(s=>s.id===managerId) : null;
      DB.hqStaff.push({id,name,pass:pass||'1234',staffRole,department:dept||'',
        managerId:staffRole==='staff'?(managerId||''):'',
        managerName:staffRole==='staff'?(mgr?.name||''):'',
        role:'hq'});
      added++;
    });
    await saveDB();inp.value='';renderSettPanel();
    toast(`${added}名追加、${skipped}名スキップ`,'success');
  };
  r.readAsText(f,'UTF-8');
}

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btnOutline" onclick="exportData()">📥 エクスポート</button>
      <label class="btnOutline" style="cursor:pointer">📤 インポート<input type="file" accept=".json" onchange="importData(this)" style="display:none"></label>
      <button class="btnOutline" style="color:var(--red);border-color:var(--red)" onclick="clearData()">🗑 初期化</button>
    </div>
    <p style="font-size:11px;color:var(--gray);margin-top:10px">文書: ${DB.docs.length}件 / 報告: ${DB.reports.length}件 / 店舗: ${DB.stores.length}件</p>
  </div>`;
}
function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`hanbancho_${new Date().toISOString().slice(0,10)}.json`;a.click();}
async function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{try{if(!confirm('上書きしますか？'))return;const d=JSON.parse(e.target.result);['docs','reports','stores','areas','categories','users','nextId','hqStaff','docDrafts','templates','reminders','departments','nextMsgId','nextDraftId','nextTplId','workflowEnabled'].forEach(k=>{if(d[k]!==undefined)DB[k]=d[k];});await saveDB();toast('インポートしました','success');goTab('list');}catch(e){toast('ファイル形式エラー','error');}};r.readAsText(f);}
async function clearData(){if(!confirm('全データを初期化しますか？'))return;DB.docs=[];DB.reports=[];DB.nextId=1;await saveDB();toast('初期化しました');goTab('list');}

// ========== UTILS ==========
function showModal(html){const ov=document.getElementById('ov');ov.innerHTML=html;ov.style.display='flex';}
function closeModal(){document.getElementById('ov').style.display='none';}
function ovClick(e){if(e.target===document.getElementById('ov'))closeModal();}
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+(type==='success'?'success':type==='error'?'error':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function dlFile(data,name){const a=document.createElement('a');a.href=data;a.download=name;a.click();}
function showPhoto(src){showModal(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px"><img src="${src}" style="max-width:80vw;max-height:80vh;border-radius:8px"><button class="btnGray" onclick="closeModal()">閉じる</button></div>`);}

// ========== INIT ==========
(async () => {
  // ローディングオーバーレイを表示
  const loader = document.createElement('div');
  loader.id = 'initLoader';
  loader.style.cssText = [
    'position:fixed', 'inset:0', 'background:#fff',
    'display:flex', 'flex-direction:column',
    'align-items:center', 'justify-content:center',
    'z-index:9999', 'gap:16px',
    'font-family:\'Noto Sans JP\',sans-serif'
  ].join(';');
  loader.innerHTML = `
    <div style="font-size:32px">✔</div>
    <div style="font-size:16px;font-weight:700;color:#1565C0;letter-spacing:1px">スマートリンク</div>
    <div style="font-size:13px;color:#757575">データを読み込んでいます...</div>
    <div style="width:200px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden">
      <div style="height:100%;background:#1565C0;border-radius:2px;animation:ldbar 1.4s ease-in-out infinite"></div>
    </div>
    <style>@keyframes ldbar{0%{width:0%;margin-left:0}50%{width:70%;margin-left:15%}100%{width:0%;margin-left:100%}}</style>
  `;
  document.body.appendChild(loader);

  await loadDB();

  loader.remove();
  initLoginStores();
})();
</script>
</body>
